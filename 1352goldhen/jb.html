<!DOCTYPE html>
<html>
<head>
<title>محمد خالد للشروحات صيانه تهكير 07714434273</title>
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #0b0d10;
    color: #c8ced8;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  #brand {
    text-align: center;
    padding: 8px 10px;
    background: #0e1116;
    border-bottom: 1px solid #1e2732;
  }
  #brand img {
    width: 28px;
    height: 28px;
    margin-right: 8px;
    border-radius: 50%;
    vertical-align: middle;
  }
  #brand b {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #e6ebf2;
    vertical-align: middle;
  }
  #spin {
    position: fixed;
    top: calc(50% + 20px);
    left: 50%;
    width: 46px;
    height: 46px;
    margin: -23px 0 0 -23px;
    border: 4px solid #1e2732;
    border-top-color: #7fd0a0;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "يعمل من نظام 7.00 الى 13.52";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.00) {
            window.location.replace("cacheslopkit.html");
        } else if (fwNum >= 13.02 && fwNum <= 13.52) {
            window.location.replace("cache1352.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "1352/chain_1352.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>

<div id="brand">
  <!-- يمكنك تغيير المسار logo.png لاحقاً لاسم صورتك الفعلي المرفوع على الجيت هاب -->
  <img src="logo.png" onerror="this.style.display='none';">
  <b>محمد خالد للشروحات صيانه تهكير 07714434273</b>
</div>

<div id="spin"></div>

<br>
<h1 id="msgs" style="font-size: 24px; text-align: center; margin-top: 150px;">جاري تحميل GoldHEN v2.4b18.10... يرجى الانتظار</h1>
</body>
</html>
